<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiiii Jackie Click the heart!</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ffd3e0,#ffc3a0);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    color:white;
    animation:fade 2s;
    z-index:2;
    padding:20px;
}

h1{
    font-size:55px;
    margin-bottom:20px;
}

#typing{
    font-size:24px;
    max-width:700px;
    line-height:1.8;
    min-height:150px;
    margin:auto;
}

button{
    margin-top:40px;
    padding:15px 40px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    background:white;
    color:#ff4d79;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
bottom:-50px;
color:white;
font-size:25px;
animation:float linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>

</head>

<body>

<div class="container">
<h1>Hi 😊</h1>

<div id="typing"></div>

<button onclick="location.href='Confession.html'">
Continue ❤️
</button>
</div>

<script>

const text =
"Before anything else... thank you for taking the time to open this. There's something I've wanted to tell you, and I hope you'll read it until the end. ❤️";

let i=0;

function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,40);
}
}

type();

for(let i=0;i<50;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*25)+"px";
heart.style.animationDuration=(5+Math.random()*6)+"s";
heart.style.animationDelay=Math.random()*5+"s";
document.body.appendChild(heart);
}

</script>

</body>
</html>
